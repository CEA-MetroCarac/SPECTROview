[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectroview"
dynamic = ["version"]
description = "SPECTROView: A Tool for Spectroscopic Data Processing and Visualization"
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "SPECTROview", "fit", "fitting", "spectra", "spectrum", "spectroscopic", 
    "visualization", "Raman", "Photoluminescence", "wafer-data", "2D-maps", 
    "data-analysis", "MVVM", "PySide6", "Qt", "hyperspectral-imaging"
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Van Hoan Le", email = "van-hoan.le@cea.fr"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]

dependencies = [
    "numpy>=2.0.2",
    "pandas>=3.0.1",
    "scipy>=1.17.1",
    "matplotlib>=3.8.0,<3.10.9",
    "openpyxl>=3.1.5",
    "pyarrow>=15.0.0",
    "pybaselines>=1.2.1",
    "PySide6>=6.10.2",
    "superqt>=0.7.8",
    "renishawWiRE>=0.1.16",
    "pywin32>=306; platform_system == 'Windows'",
    "markdown>=3.6.0",
    "certifi>=2026.10.19",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "ollama>=0.4.0",
    "truststore>=0.9.0",
    "mcp>=2.2.0",
    "pyyaml>=6.0.1"
]

[tool.setuptools.package-data]
spectroview = [
    "resources/*.mplstyle", 
    "resources/*.png", 
    "resources/icons/*.png",
    "resources/icons/*.ico",
    "resources/icons/*.svg",
    "resources/user_manual/*",
    "resources/user_manual_images/*/*",
    "ai_agent/config/*.yaml",
    "ai_agent/prompts/*.md",
    "ai_agent/rules/*.md",
    "ai_agent/knowledge/*.md",
    "ai_agent/examples/*.md",
    # NOTE: ai_agent/TEMPLATE/ and ai_agent/CHATLOG/ are deliberately NOT
    # packaged. Both are gitignored user data (saved recipes and chat history)
    # written at runtime, so a glob here could only bundle whoever built the
    # wheel's own files into a published release.
]

[project.scripts]
spectroview = "spectroview.main:launcher"

[project.urls]
Homepage = "https://github.com/CEA-MetroCarac/SPECTROview"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-qt>=4.3.0", "black", "flake8"]
test = ["pytest>=8.0.0", "pytest-qt>=4.3.0"]

[tool.setuptools.dynamic]
version = { attr = "spectroview.VERSION" }

[tool.setuptools.packages.find]
where = ["."]
include = ["spectroview*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
